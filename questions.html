<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question bank · IALqBank</title>
    <meta name="description" content="Past-paper questions for Pearson Edexcel International AS and A Level Physics, Chemistry, Biology and Maths, with hidden answers, step-by-step explanations and keyword search.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/bank.css">
</head>
<body class="bank" data-subject="physics">
    <header class="bank-top">
        <a class="bank-logo" href="index.html">IALqBank</a>
        <nav class="subject-tabs" aria-label="Subjects">
            <a class="subject-tab" href="questions.html?s=physics" data-subject="physics">Physics</a>
            <a class="subject-tab" href="questions.html?s=chemistry" data-subject="chemistry">Chemistry</a>
            <a class="subject-tab" href="questions.html?s=biology" data-subject="biology">Biology</a>
            <a class="subject-tab" href="questions.html?s=maths" data-subject="maths">Maths</a>
        </nav>
        <button class="notes-toggle" type="button" aria-controls="notes-drawer" aria-expanded="false">Notes</button>
    </header>

    <main class="bank-main">
        <section class="bank-intro">
            <h1 id="subject-title">Question bank</h1>
            <p id="subject-blurb">Past paper questions for Pearson Edexcel International A-level, grouped by paper. Answers stay hidden until you choose to reveal them, and each one opens into step-by-step working.</p>
        </section>

        <nav class="view-bar" id="view-bar" aria-label="Question lists"></nav>

        <section class="search-panel" aria-label="Search questions">
            <label class="search-label" for="q-search">Search by topic or keyword</label>
            <input id="q-search" class="search-input" type="search" placeholder="A topic, or any word from a question" autocomplete="off">
            <div class="filter-row" id="topic-filters" role="group" aria-label="Filter by topic"></div>
            <p class="result-count" id="result-count" aria-live="polite"></p>
        </section>

        <section class="question-list" id="question-list" aria-label="Questions"></section>
    </main>

    <aside class="notes-drawer" id="notes-drawer" aria-label="Notes" aria-hidden="true">
        <div class="drawer-head">
            <h2 id="drawer-title">Notes</h2>
            <button class="drawer-close" type="button" aria-label="Close notes">×</button>
        </div>
        <div class="drawer-body" id="notes-body"></div>
    </aside>
    <div class="drawer-scrim" id="drawer-scrim" hidden></div>

    <script src="js/format.js"></script>
    <script src="js/taxonomy.js"></script>
    <script src="js/bank.js"></script>
</body>
</html>
